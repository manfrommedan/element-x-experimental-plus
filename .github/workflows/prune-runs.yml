name: Prune old workflow runs

# Keeps only the 2 most recent workflow runs in the whole repo and deletes the rest.
# Runs daily and can be triggered manually.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: prune-runs
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all but the 2 most recent runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: '2'
        run: |
          set -euo pipefail
          # List every run as "created_at id", newest first, skip the newest KEEP, delete the rest.
          gh api --paginate "repos/$REPO/actions/runs" \
            --jq '.workflow_runs[] | "\(.created_at) \(.id)"' \
            | sort -r \
            | tail -n +$((KEEP + 1)) \
            | awk '{print $2}' \
            | while read -r id; do
                echo "Deleting run $id"
                gh api -X DELETE "repos/$REPO/actions/runs/$id" \
                  || echo "  skipped $id (in progress or already gone)"
              done
          echo "Done."
